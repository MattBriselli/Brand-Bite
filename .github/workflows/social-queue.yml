name: Queue social posts to Buffer

on:
  schedule:
    # Daily morning post (7 days/week) at 15:15 UTC (10:15 AM EST / 11:15 AM EDT)
    # Includes special-day / food-holiday / deal-wave detection
    - cron: "15 15 * * *"
    # Optional daily afternoon post (7 days/week) at 20:15 UTC (3:15 PM EST / 4:15 PM EDT)
    # Fires ONLY if there is enough fresh interesting content today & it differs from morning
    - cron: "15 20 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "Posting slot (auto infers morning vs afternoon from Eastern time)"
        required: false
        default: "auto"
        type: choice
        options:
          - "auto"
          - "morning"
          - "afternoon"
      dry_run:
        description: "Preview without posting to Buffer"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      custom_text:
        description: "Optional custom caption to push to all 3 channels"
        required: false
        default: ""
      custom_image:
        description: "Optional HTTPS image URL (defaults to BrandBite avatar)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: social-queue
  cancel-in-progress: false

jobs:
  queue-buffer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Queue next BrandBite post in Buffer
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          CUSTOM_TEXT: ${{ github.event.inputs.custom_text }}
          CUSTOM_IMAGE: ${{ github.event.inputs.custom_image }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          INPUT_SLOT: ${{ github.event.inputs.slot }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          args=()
          if [ -n "$INPUT_SLOT" ]; then
            args+=(--slot "$INPUT_SLOT")
          elif [ "$EVENT_SCHEDULE" = "15 20 * * *" ]; then
            args+=(--slot afternoon)
          elif [ "$EVENT_SCHEDULE" = "15 15 * * *" ]; then
            args+=(--slot morning)
          else
            args+=(--slot auto)
          fi
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          if [ -n "$CUSTOM_TEXT" ]; then
            args+=(--text "$CUSTOM_TEXT")
          fi
          if [ -n "$CUSTOM_IMAGE" ]; then
            args+=(--image "$CUSTOM_IMAGE")
          fi
          node scripts/queue-buffer.mjs "${args[@]}"

      - name: Commit updated social ledger
        run: |
          if git diff --quiet -- src/data/trend-alerts-history.json; then
            echo "No social ledger changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
            git add src/data/trend-alerts-history.json
            git commit -m "chore: record social post ledger ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git pull --rebase origin main
            git push origin main
          fi
