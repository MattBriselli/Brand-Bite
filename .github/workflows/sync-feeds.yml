name: Sync live feeds

on:
  schedule:
    # Every 6 hours (GitHub cron runs in UTC)
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-feeds
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CF_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Fetch and synthesize feeds
        run: node scripts/sync-feeds.mjs --if-changed

      - name: Check for feed changes
        id: feed_diff
        run: |
          if git diff --quiet -- src/data/live-feed.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No feed changes."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Feed updated!"
          fi

      - name: Commit and push updated feed
        if: steps.feed_diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git add src/data/live-feed.json
          git commit -m "chore: sync live feeds ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git push

      - name: Trigger Cloudflare Workers Build
        if: (steps.feed_diff.outputs.changed == 'true' || github.event_name == 'workflow_dispatch') && env.CF_HOOK != ''
        run: curl -fsS -X POST "$CF_HOOK"
