name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main

concurrency:
  group: firebase-deploy
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BRANDBITE_FEED }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static Next.js export
        run: npm run build

      - name: Warn if Firebase secret is not yet configured
        if: env.FIREBASE_SA == ''
        run: |
          echo "::notice::Add the FIREBASE_SERVICE_ACCOUNT_BRANDBITE_FEED secret in GitHub repo settings to enable automatic Firebase Hosting deploys."

      - name: Deploy to Firebase Hosting (live)
        if: env.FIREBASE_SA != ''
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BRANDBITE_FEED }}
          channelId: live
          projectId: brandbite-feed
