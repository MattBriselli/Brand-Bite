<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <style>
    .ticket-rim { stroke: #181512; }
    @media (prefers-color-scheme: dark) {
      .ticket-rim { stroke: #fef3c7; }
    }
  </style>
  <defs>
    <linearGradient id="ticketGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <!-- Scalloped 3-tooth bite mask cutting into the top-right corner -->
    <mask id="chompMask">
      <rect width="64" height="64" fill="white" />
      <circle cx="57" cy="9" r="10.5" fill="black" />
      <circle cx="46" cy="4" r="7.5" fill="black" />
      <circle cx="61" cy="20" r="7.5" fill="black" />
    </mask>
  </defs>

  <g mask="url(#chompMask)">
    <!-- Retro fast-food ticket badge -->
    <rect x="4" y="4" width="56" height="56" rx="15" fill="url(#ticketGrad)" class="ticket-rim" stroke-width="3.5" />

    <!-- Bite-edge outline accent so the chomp reads crisp at 16x16 -->
    <circle cx="57" cy="9" r="10.5" fill="none" class="ticket-rim" stroke-width="3.2" />
    <circle cx="46" cy="4" r="7.5" fill="none" class="ticket-rim" stroke-width="3.2" />
    <circle cx="61" cy="20" r="7.5" fill="none" class="ticket-rim" stroke-width="3.2" />

    <!-- Top sesame bun dome -->
    <path d="M14 29 C14 16, 48 16, 48 29 Z" fill="#fbbf24" stroke="#181512" stroke-width="2.5" stroke-linejoin="round" />
    <!-- Sesame seeds -->
    <ellipse cx="25" cy="22" rx="2.3" ry="1.2" transform="rotate(-18 25 22)" fill="#fffbeb" />
    <ellipse cx="33" cy="20.5" rx="2.3" ry="1.2" transform="rotate(12 33 20.5)" fill="#fffbeb" />
    <ellipse cx="39.5" cy="23.5" rx="2.1" ry="1.1" transform="rotate(22 39.5 23.5)" fill="#fffbeb" />

    <!-- Crisp lettuce wave -->
    <path d="M12.5 32 Q18 29 23 32 T33 32 T43 32 T49.5 32" fill="none" stroke="#22c55e" stroke-width="3.8" stroke-linecap="round" />

    <!-- Seared burger patty -->
    <rect x="13" y="34.5" width="36" height="7.5" rx="3.75" fill="#451a03" stroke="#181512" stroke-width="2.2" />

    <!-- Melted cheddar cheese corner drip -->
    <path d="M16 34.5 L46 34.5 L35 42.5 L28 36.5 Z" fill="#facc15" stroke="#181512" stroke-width="1.6" stroke-linejoin="round" />

    <!-- Toasted bottom bun -->
    <path d="M15 43.5 H47 C47 49, 43 51, 31 51 C19 51, 15 49, 15 43.5 Z" fill="#f59e0b" stroke="#181512" stroke-width="2.5" stroke-linejoin="round" />
  </g>
</svg>
