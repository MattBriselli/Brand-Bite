<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#181512" />
      <stop offset="100%" stop-color="#29221d" />
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <mask id="avatarChomp">
      <rect width="512" height="512" fill="white" />
      <circle cx="412" cy="110" r="68" fill="black" />
      <circle cx="342" cy="76" r="48" fill="black" />
      <circle cx="440" cy="180" r="48" fill="black" />
    </mask>
  </defs>

  <rect width="512" height="512" fill="url(#bg)" />

  <g mask="url(#avatarChomp)">
    <rect x="76" y="76" width="360" height="360" rx="92" fill="url(#badge)" stroke="#fef3c7" stroke-width="16" />
    <circle cx="412" cy="110" r="68" fill="none" stroke="#fef3c7" stroke-width="16" />
    <circle cx="342" cy="76" r="48" fill="none" stroke="#fef3c7" stroke-width="16" />
    <circle cx="440" cy="180" r="48" fill="none" stroke="#fef3c7" stroke-width="16" />

    <!-- Sesame Top Bun -->
    <path d="M140 242 C140 152, 364 152, 364 242 Z" fill="#fbbf24" stroke="#181512" stroke-width="14" stroke-linejoin="round" />
    <ellipse cx="212" cy="194" rx="15" ry="8" transform="rotate(-18 212 194)" fill="#fffbeb" />
    <ellipse cx="264" cy="184" rx="15" ry="8" transform="rotate(10 264 184)" fill="#fffbeb" />
    <ellipse cx="308" cy="204" rx="14" ry="7.5" transform="rotate(22 308 204)" fill="#fffbeb" />

    <!-- Crisp Lettuce -->
    <path d="M132 262 Q166 242 200 262 T268 262 T336 262 T372 262" fill="none" stroke="#22c55e" stroke-width="24" stroke-linecap="round" />

    <!-- Patty -->
    <rect x="134" y="278" width="236" height="48" rx="24" fill="#451a03" stroke="#181512" stroke-width="14" />

    <!-- Melted Cheese Drip -->
    <path d="M154 278 L350 278 L278 332 L232 292 Z" fill="#facc15" stroke="#181512" stroke-width="10" stroke-linejoin="round" />

    <!-- Bottom Bun -->
    <path d="M148 338 H356 C356 374, 330 388, 252 388 C174 388, 148 374, 148 338 Z" fill="#f59e0b" stroke="#181512" stroke-width="14" stroke-linejoin="round" />
  </g>
