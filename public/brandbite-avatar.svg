<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141814" />
      <stop offset="100%" stop-color="#1c271d" />
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <mask id="avatarChomp">
      <rect width="512" height="512" fill="white" />
      <circle cx="412" cy="110" r="68" fill="black" />
      <circle cx="342" cy="76" r="48" fill="black" />
      <circle cx="440" cy="180" r="48" fill="black" />
    </mask>
  </defs>

  <rect width="512" height="512" fill="url(#bg)" />

  <g mask="url(#avatarChomp)">
    <rect x="76" y="76" width="360" height="360" rx="92" fill="url(#badge)" stroke="#fef3c7" stroke-width="16" />
    <circle cx="412" cy="110" r="68" fill="none" stroke="#fef3c7" stroke-width="16" />
    <circle cx="342" cy="76" r="48" fill="none" stroke="#fef3c7" stroke-width="16" />
    <circle cx="440" cy="180" r="48" fill="none" stroke="#fef3c7" stroke-width="16" />

    <!-- Snow Dots -->
    <circle cx="132" cy="136" r="10" fill="#fef3c7" opacity="0.9" />
    <circle cx="390" cy="360" r="9" fill="#fef3c7" opacity="0.85" />
    <circle cx="128" cy="382" r="8" fill="#fef3c7" opacity="0.8" />

    <!-- Sesame Top Bun -->
    <path d="M140 256 C140 168, 364 168, 364 256 Z" fill="#fbbf24" stroke="#181512" stroke-width="14" stroke-linejoin="round" />
    <ellipse cx="220" cy="212" rx="14" ry="7.5" transform="rotate(-15 220 212)" fill="#fffbeb" />
    <ellipse cx="272" cy="200" rx="14" ry="7.5" transform="rotate(10 272 200)" fill="#fffbeb" />
    <ellipse cx="316" cy="218" rx="13" ry="7" transform="rotate(20 316 218)" fill="#fffbeb" />

    <!-- Santa Hat -->
    <path d="M150 184 C162 118, 236 96, 286 122 C258 136, 242 156, 244 184 Z" fill="#ef4444" stroke="#181512" stroke-width="12" stroke-linejoin="round" />
    <rect x="138" y="168" width="116" height="30" rx="15" transform="rotate(-10 196 183)" fill="#ffffff" stroke="#181512" stroke-width="10" />
    <circle cx="294" cy="126" r="20" fill="#ffffff" stroke="#181512" stroke-width="10" />

    <!-- Crisp Lettuce -->
    <path d="M132 276 Q166 256 200 276 T268 276 T336 276 T372 276" fill="none" stroke="#22c55e" stroke-width="24" stroke-linecap="round" />

    <!-- Patty -->
    <rect x="134" y="292" width="236" height="46" rx="23" fill="#451a03" stroke="#181512" stroke-width="14" />

    <!-- Melted Cheese Drip -->
    <path d="M154 292 L350 292 L278 344 L232 306 Z" fill="#facc15" stroke="#181512" stroke-width="10" stroke-linejoin="round" />

    <!-- Bottom Bun -->
    <path d="M148 350 H356 C356 386, 330 400, 252 400 C174 400, 148 386, 148 350 Z" fill="#f59e0b" stroke="#181512" stroke-width="14" stroke-linejoin="round" />
  </g>
</svg>
