<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2e1065"/>
      <stop offset="50%" stop-color="#581c87"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="cheese" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg1)"/>
  <circle cx="680" cy="110" r="180" fill="#a855f7" opacity="0.18"/>
  <circle cx="120" cy="420" r="210" fill="#f59e0b" opacity="0.12"/>
  <!-- Plate shadow -->
  <ellipse cx="400" cy="390" rx="250" ry="38" fill="#1e0942" opacity="0.65"/>
  <!-- Outer crispy flatbread / chalupa shell -->
  <path d="M 190 340 C 190 175, 610 175, 610 340 C 610 375, 190 375, 190 340 Z" fill="url(#shell)" stroke="#fef08a" stroke-width="4"/>
  <!-- Toasted cheese crust blisters -->
  <circle cx="270" cy="280" r="18" fill="#d97706" opacity="0.7"/>
  <circle cx="340" cy="250" r="24" fill="#d97706" opacity="0.6"/>
  <circle cx="460" cy="260" r="20" fill="#d97706" opacity="0.7"/>
  <circle cx="530" cy="295" r="16" fill="#d97706" opacity="0.65"/>
  <circle cx="395" cy="300" r="22" fill="#b45309" opacity="0.5"/>
  <!-- Inner filling peeking out top -->
  <path d="M 220 265 Q 310 210 400 225 Q 490 210 580 265 Q 490 240 400 248 Q 310 240 220 265 Z" fill="#78350f"/>
  <!-- Lettuce shreds -->
  <path d="M 235 255 Q 270 215 310 248 T 385 238 T 465 245 T 555 252" fill="none" stroke="#4ade80" stroke-width="14" stroke-linecap="round"/>
  <!-- Diced tomatoes -->
  <rect x="290" y="225" width="22" height="22" rx="5" fill="#ef4444" transform="rotate(-12 290 225)"/>
  <rect x="395" y="218" width="24" height="24" rx="5" fill="#dc2626" transform="rotate(8 395 218)"/>
  <rect x="485" y="228" width="20" height="20" rx="5" fill="#ef4444" transform="rotate(15 485 228)"/>
  <!-- Baja chipotle drizzle -->
  <path d="M 250 260 Q 300 295 350 255 T 450 265 T 545 258" fill="none" stroke="url(#cheese)" stroke-width="10" stroke-linecap="round"/>
  <!-- Editorial badge -->
  <rect x="44" y="40" width="215" height="40" rx="20" fill="#faf5ff" opacity="0.95"/>
  <text x="151" y="66" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#581c87" text-anchor="middle" letter-spacing="1">TACO BELL REVIEW</text>
</svg>
